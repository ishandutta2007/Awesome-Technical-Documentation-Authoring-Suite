<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Flow Line Animations */
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      .pipeline-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 4s linear infinite;
      }
      .pipeline-line-fast {
        stroke-dasharray: 6 5;
        animation: dashFlow 2.5s linear infinite;
      }

      /* Floating Ambient Pills (Background) */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }

      .floating-pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatDelay 6s ease-in-out infinite;
      }
      .pulse-orb {
        transform-origin: center;
        animation: pulseGlow 7s ease-in-out infinite;
      }

      /* Clean typography */
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>
  <rect width="1198" height="358" x="1" y="1" fill="none" stroke="#334155" stroke-opacity="0.4" rx="15"/>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="pulse-orb" cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.2" filter="url(#glow)"/>
  <circle class="pulse-orb" cx="1060" cy="270" r="160" fill="#8b5cf6" opacity="0.22" filter="url(#glow)"/>
  <circle class="pulse-orb" cx="620" cy="30" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Grid Blueprint Pattern Background -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Dynamic Technical Pipeline Streams (Background Layer) -->
  <g opacity="0.75">
    <!-- Stream 1: Left Input to Center Engine -->
    <path d="M 60 70 Q 200 40 330 90 T 560 75" fill="none" stroke="#38bdf8" stroke-width="2" class="pipeline-line" opacity="0.5"/>
    <path d="M 40 290 Q 220 320 380 270 T 640 285" fill="none" stroke="#818cf8" stroke-width="2" class="pipeline-line-fast" opacity="0.45"/>
    <!-- Stream 2: Center Engine to Right Output Formats -->
    <path d="M 660 75 Q 850 40 1000 85 T 1150 70" fill="none" stroke="#a78bfa" stroke-width="2" class="pipeline-line" opacity="0.5"/>
    <path d="M 650 285 Q 860 330 1010 275 T 1160 290" fill="none" stroke="#34d399" stroke-width="2" class="pipeline-line-fast" opacity="0.45"/>
  </g>

  <!-- Dynamic Floating Decorative Tags / Badges in Background Layer -->
  <g class="floating-pill-1">
    <!-- Top-Left Pill: Markdown & AsciiDoc -->
    <g transform="translate(65, 45)">
      <rect width="145" height="28" rx="14" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
      <text x="28" y="18" fill="#e2e8f0" class="badge-text">Docs-as-Code Flow</text>
    </g>
    <!-- Top-Right Pill: Multi-Format Publishing -->
    <g transform="translate(980, 45)">
      <rect width="155" height="28" rx="14" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="14" r="4" fill="#a855f7"/>
      <text x="28" y="18" fill="#e2e8f0" class="badge-text">HTML • PDF • EPUB</text>
    </g>
  </g>

  <g class="floating-pill-2">
    <!-- Bottom-Left Pill: DITA / XML & CCMS -->
    <g transform="translate(75, 285)">
      <rect width="155" height="28" rx="14" fill="url(#pillGrad1)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="14" r="4" fill="#818cf8"/>
      <text x="28" y="18" fill="#e2e8f0" class="badge-text">Structured Authoring</text>
    </g>
    <!-- Bottom-Right Pill: Single-Source Reuse -->
    <g transform="translate(975, 285)">
      <rect width="150" height="28" rx="14" fill="url(#pillGrad1)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="14" r="4" fill="#34d399"/>
      <text x="28" y="18" fill="#e2e8f0" class="badge-text">Enterprise CCMS</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: High Z-Index & Perfectly Legible -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Badge Over Title -->
    <g transform="translate(0, -25)">
      <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1"/>
      <text x="0" y="4" fill="#38bdf8" class="badge-text" text-anchor="middle" font-size="11">⚡ CURATED TECH STACK ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text y="50" fill="url(#textGrad)" class="title-text" font-size="44" filter="url(#subtleGlow)">
      Awesome Technical Documentation
    </text>
    <text y="98" fill="#f8fafc" class="title-text" font-size="34">
      Authoring Suite &amp; CCMS Workflows
    </text>

    <!-- Subtitle -->
    <text y="138" fill="#94a3b8" class="subtitle-text" font-size="16">
      Structured Authoring • Docs-as-Code Pipelines • Multi-Channel Publishing
    </text>

    <!-- Decorative Central Underline Indicator -->
    <g transform="translate(-160, 154)">
      <rect width="100" height="3" rx="1.5" fill="#38bdf8" opacity="0.8"/>
      <rect x="110" width="100" height="3" rx="1.5" fill="#818cf8" opacity="0.8"/>
      <rect x="220" width="100" height="3" rx="1.5" fill="#c084fc" opacity="0.8"/>
    </g>
  </g>
</svg>